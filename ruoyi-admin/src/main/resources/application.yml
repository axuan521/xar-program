# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径（Windows 本地默认 C:/ruoyi/uploadPath；Linux 服务器设环境变量 RUOYI_UPLOAD_PATH=/home/ruoyi/uploadPath，
  # 或使用 prod 配置，其中已覆盖为 Linux 路径。此目录同时存放知识库向量库文件 kb/vector-store.json）
  profile: ${RUOYI_UPLOAD_PATH:C:/ruoyi/uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true


# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# ------------------- 扫码点单小程序 -------------------
wx:
  # 小程序登录（微信公众平台 - 开发管理 - 开发设置 中获取）
  miniapp:
    appid:
    secret:
    # 本地开发无 appid 时置 true：code 直接当作 openid，可在 H5 跑通全流程。上线必须改为 false
    mock-enabled: true
    # 登录态有效期（天）
    expire-days: 7
  # 微信支付 V3（商户号需个体工商户及以上主体方可申请，个人主体无法开通）
  # 以下任一项缺失或 disabled=true 时，支付自动降级为「到店付款」，点单功能不受影响
  pay:
    disabled: false
    # 开发期模拟支付：顾客点「模拟支付」即可置为已支付，便于未办商户号时联调全流程。上线必须 false
    mock-enabled: true
    appid:
    mchid:
    # 商户 API 证书序列号（商户平台 - 账户中心 - API安全）
    merchant-serial-number:
    # 商户私钥 apiclient_key.pem 的服务器绝对路径
    private-key-path:
    # APIv3 密钥（32位），用于解密支付回调
    api-v3-key:
    # 支付结果回调地址，必须 HTTPS 且外网可达
    notify-url:
    # 微信支付公钥ID（推荐公钥模式；留空则跳过序列号校验）
    public-key-id:
    # 微信支付公钥或平台证书 pem 的服务器绝对路径，用于回调验签
    public-key-path:

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
