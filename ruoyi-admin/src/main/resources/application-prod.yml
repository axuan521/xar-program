# 生产环境（Linux 服务器）配置
# 覆盖 application.yml 中的 Windows 本地默认路径；
# 该目录同时存放知识库上传文件与向量库 kb/vector-store.json，需保证应用进程可读写
ruoyi:
    profile: ${RUOYI_UPLOAD_PATH:/home/ruoyi/uploadPath}

# 生产环境日志级别
# 覆盖 application.yml 里的 com.ruoyi: debug。DEBUG 下 MyBatis 会全量打印每条 SQL 及参数，
# 经 systemd/journald 落盘后磁盘 IO 被打满，实测导致单行 UPDATE 耗时 6.7 秒、登录接口约 9 秒，
# 前端 10 秒超时被压线卡死。生产必须用 warn。
logging:
    level:
        com.ruoyi: warn
        org.springframework: warn

spring:
    ai:
        openai:
            api-key: sk-ws-H.PIPMHHX.3Lyl.MEYCIQCJLHRKzxAxDR7AyogE0ertiQvwpOEetW8NcuaKuQ4iKQIhALXfzGsn9hpqfNqElUoRw9c_hoX3keSW7bW9f3kr3IbK
            base-url: https://dashscope.aliyuncs.com/compatible-mode/v1   # 1.1.x 官方SDK必须带 /v1
            chat:
                options:
                    model: qwen-plus
                    temperature: 0.7
            # RAG 向量化模型（阿里云百炼，兼容模式；Spring AI 2.x 扁平写法，不再用 .options）
            embedding:
                model: text-embedding-v3
                dimensions: 1024
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # 主库数据源
            master:
                url: jdbc:mysql://localhost:3306/ry_vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
                username: ryuser
                password: WUlinxuan1.
            # 从库数据源
            slave:
                enabled: false
                url:
                username:
                password:
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter:
                enabled: true
            # 生产环境关闭 druid 监控台
            # 原为 enabled: true 且弱口令 ruoyi/123456，公网可访问 /druid/ 会暴露 SQL 与库结构；
            # 同时监控台自身统计也带来额外开销。需要临时排查时改回 true 并设置强密码，排查完再关。
            statViewServlet:
                enabled: false
                allow:
                url-pattern: /druid/*
                login-username: ruoyi
                login-password: 123456
            filter:
                stat:
                    enabled: true
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true
    data:
        # redis 配置
        redis:
            # 地址
            host: localhost
            # 端口，默认为6379
            port: 6379
            # 数据库索引
            database: 0
            # 密码
            password: wulinxuan1.
            # 连接超时时间
            timeout: 10s
            lettuce:
                pool:
                    # 连接池中的最小空闲连接
                    min-idle: 0
                    # 连接池中的最大空闲连接
                    max-idle: 8
                    # 连接池的最大数据库连接数
                    max-active: 8
                    # #连接池最大阻塞等待时间（使用负值表示没有限制）
                    max-wait: -1ms